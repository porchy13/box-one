situation.dangerThree.ask=Box 15 is coming. What do you do?
situation.dangerThree.behaviour.1=I slow down hard well before the box, and drive over the ditch at walking pace, \
  through the WPS.
situation.dangerThree.behaviour.2=I keep my pace: the ditch is marked, I only have to aim well.
situation.dangerThree.behaviour.3=I go wide around the box to avoid the ditch.
situation.dangerThree.behaviour.4=I brake only once I see the ditch.
situation.dangerThree.why=Three exclamation marks are the highest danger: they always go with a WPS, validated at 30 \
  m, and set off the audible alarm of the warning system (FIM, art. 11.4). Pass through it, slowly, having slowed down \
  well before.
situation.dangerOne.ask=Box 8 shows a bump. What do you do?
situation.dangerOne.behaviour.1=I ease off and cross the bump carefully, then go on.
situation.dangerOne.behaviour.2=I stop before the bump.
situation.dangerOne.behaviour.3=I speed up to jump it.
situation.dangerOne.behaviour.4=I ignore it: one exclamation mark does not count.
situation.dangerOne.why=One exclamation mark is the lowest danger (FIM, symbols of the road book): easing off is \
  enough, without stopping. No danger mark is to be ignored.
situation.dangerTwo.ask=Box 4 shows a dip. What do you do?
situation.dangerTwo.behaviour.1=I slow down clearly before the dip, then pick up speed again.
situation.dangerTwo.behaviour.2=I keep my speed: only a danger of level 3 asks to slow down.
situation.dangerTwo.behaviour.3=I stop and get out to look at the dip.
situation.dangerTwo.behaviour.4=I leave the track to drive beside it.
situation.dangerTwo.why=Two exclamation marks are a serious danger, also signalled by the audible alarm of the warning \
  system (FIM, art. 11.4): take it clearly slower. Leaving the track exposes you to other, unknown dangers and to \
  missing the rest of the roadbook.
situation.dangerAhead.ask=You pass box 21. What do you do?
situation.dangerAhead.behaviour.1=I slow down already: the next box, 250 m on, is a danger of level 3.
situation.dangerAhead.behaviour.2=I speed up: there are 250 m left before slowing down.
situation.dangerAhead.behaviour.3=I read the next box only once I reach it.
situation.dangerAhead.behaviour.4=I stop at box 21 to wait.
situation.dangerAhead.why=Always read the next box: 250 m away, it comes quickly, and a danger of level 3, marked by a \
  WPS validated at 30 m, asks to have slowed down before (FIM, art. 11.4).
situation.dangerSummit.ask=Box 12 shows a summit. What do you do?
situation.dangerSummit.behaviour.1=I slow down before the summit: I cannot see what lies behind it.
situation.dangerSummit.behaviour.2=I speed up to cross the summit with momentum.
situation.dangerSummit.behaviour.3=I move to the left to see better.
situation.dangerSummit.behaviour.4=I stop on the summit to look.
situation.dangerSummit.why=Behind a summit, the track may turn or drop without warning: adapt your driving to the \
  ground (FIM, art. 11.4) by arriving slowly, keeping to your line. Stopping there is a danger for those who follow.
situation.maskedWaypoint.ask=Box 11 has a WPM. How do you reach it?
situation.maskedWaypoint.behaviour.1=I follow the roadbook closely: the NAV-GPS shows the WPM only within 800 m, and \
  I must pass within 90 m.
situation.maskedWaypoint.behaviour.2=I follow the arrow of the NAV-GPS from box 10 on.
situation.maskedWaypoint.behaviour.3=I cut straight towards the waypoint.
situation.maskedWaypoint.behaviour.4=I slow down to walking pace: a WPM is a safety waypoint.
situation.maskedWaypoint.why=The WPM, masked waypoint, checks that the roadbook is followed: the NAV-GPS directs the \
  crew to it only within its opening radius, 800 m; it is validated within 90 m (FIM, art. 11.2c).
situation.controlWaypoint.ask=Box 6 has a WPC. How do you reach it?
situation.controlWaypoint.behaviour.1=I follow the roadbook exactly: the NAV-GPS gives only its name and its order, no \
  information of navigation.
situation.controlWaypoint.behaviour.2=I wait for the NAV-GPS to open it within 800 m.
situation.controlWaypoint.behaviour.3=I follow the arrow of the NAV-GPS.
situation.controlWaypoint.behaviour.4=I stop at the box to be checked.
situation.controlWaypoint.why=The WPC, control waypoint, checks that the roadbook has been respected: the NAV-GPS \
  gives only its name and its order, no information of navigation; it is validated at 300 m (FIM, art. 11.2e).
situation.visibleWaypoint.ask=Box 2 has a WPV. How do you reach it?
situation.visibleWaypoint.behaviour.1=I may follow the NAV-GPS: it shows all the information towards a WPV.
situation.visibleWaypoint.behaviour.2=The NAV-GPS shows nothing: I follow the roadbook alone.
situation.visibleWaypoint.behaviour.3=I wait to be within 800 m to see it.
situation.visibleWaypoint.behaviour.4=I must pass within 30 m of it.
situation.visibleWaypoint.why=The WPV, visible waypoint, has its coordinates in the roadbook: driving towards it, the \
  NAV-GPS shows all the information; it is validated at 200 m (FIM, art. 11.2a).
situation.navigationWaypoint.ask=Box 31 has a WPN in the dunes. What do you do?
situation.navigationWaypoint.behaviour.1=I follow the route of the roadbook without cutting: missing a WPN costs 60 \
  minutes.
situation.navigationWaypoint.behaviour.2=I cut towards it as soon as the NAV-GPS shows it.
situation.navigationWaypoint.behaviour.3=I avoid it in the dunes: it is optional.
situation.navigationWaypoint.behaviour.4=I validate it within 30 m, as a WPS.
situation.navigationWaypoint.why=The WPN stops the riders from avoiding a difficult route (dunes) or a difficulty of \
  navigation; the NAV-GPS directs to it only within 800 m, it is validated at 200 m, and missing it costs 60 minutes, \
  four times the penalty of a WPM (FIM, art. 11.2g and the table of the waypoints).
situation.eclipseWaypoint.ask=Box 18 has a WPE. When does the NAV-GPS show it?
situation.eclipseWaypoint.behaviour.1=As soon as the WPM of box 17 is validated, whatever the distance.
situation.eclipseWaypoint.behaviour.2=Only within 800 m of it.
situation.eclipseWaypoint.behaviour.3=Never: I follow the roadbook alone.
situation.eclipseWaypoint.behaviour.4=At any time, even without validating box 17.
situation.eclipseWaypoint.why=The WPE, eclipse waypoint, becomes completely visible on the NAV-GPS once the previous \
  waypoint is validated, whatever the distance between them; it is validated within 90 m (FIM, art. 11.2b).
situation.missedWaypoint.ask=At box 7, you notice that the WPM of box 6 was not validated. What do you do?
situation.missedWaypoint.behaviour.1=I go on: I never drive the itinerary the wrong way, and the missed WPM costs 15 \
  minutes.
situation.missedWaypoint.behaviour.2=I turn back along the itinerary to validate it.
situation.missedWaypoint.behaviour.3=I stop and call the organisers.
situation.missedWaypoint.behaviour.4=I cut across the fields to the next waypoint.
situation.missedWaypoint.why=Going back to validate a missed waypoint must never mean driving the itinerary the wrong \
  way; on a single narrow track, any return the wrong way leads to disqualification (FIM, art. 11.1). A missed WPM \
  costs 15 minutes (art. 11.2).
situation.zoneStart.ask=Box 4 starts a speed zone at 50 km/h. What do you do?
situation.zoneStart.behaviour.1=I slow down before it, so as to be at 50 km/h at most 90 m after the DZ, where the \
  tolerance ends.
situation.zoneStart.behaviour.2=I slow down only once the NAV-GPS shows my speed.
situation.zoneStart.behaviour.3=I may average 50 km/h over the zone.
situation.zoneStart.behaviour.4=I slow down at the FZ.
situation.zoneStart.why=The NAV-GPS guides to the DZ from 1000 m and warns 90 m before it; the 90 m after it are the \
  buffer of deceleration, then the limit applies (FIM, art. 16.1).
situation.zoneInside.ask=You drive from box 5 to box 6, in the zone started at box 4. What do you do?
situation.zoneInside.behaviour.1=I stay under 50 km/h up to the FZ: every excess is recorded every 150 m or every 10 \
  seconds.
situation.zoneInside.behaviour.2=I may exceed it briefly when nobody is around.
situation.zoneInside.behaviour.3=I keep to the limit only near the houses.
situation.zoneInside.behaviour.4=I pick up speed again once 90 m past the DZ.
situation.zoneInside.why=Between the DZ and the FZ, the speed is limited whatever the route (FIM, art. 16.2); during \
  an excess, an impulse is recorded every 150 m or every 10 seconds, and each one is penalised (art. 16).
situation.zoneFinish.ask=Box 10 finishes the speed zone. When may you speed up?
situation.zoneFinish.behaviour.1=Once within 90 m of the FZ, its validation radius: the tolerance starts there.
situation.zoneFinish.behaviour.2=As soon as I see box 10 in the roadbook.
situation.zoneFinish.behaviour.3=As soon as the road is clear.
situation.zoneFinish.behaviour.4=Only at the next box.
situation.zoneFinish.why=Around the FZ, within 90 m, a tolerance zone lets you speed up again (FIM, art. 16.3).
situation.zoneSigns.ask=Box 2 starts a zone at 50 km/h, but there is no sign on the spot. What do you do?
situation.zoneSigns.behaviour.1=I keep to the 50 km/h of the roadbook, sign or not.
situation.zoneSigns.behaviour.2=I keep my pace as long as no sign appears.
situation.zoneSigns.behaviour.3=I wait for the beep of the NAV-GPS to slow down.
situation.zoneSigns.behaviour.4=I drive at the legal speed of the country.
situation.zoneSigns.why=The limit is the one of the roadbook; the lack of signs allows no claim, and the buzzer or the \
  alarm is not official information (FIM, art. 16).
situation.zoneAcceleration.ask=At box 13, the zone at 30 km/h goes on at 50 km/h. When may you drive at 50 km/h?
situation.zoneAcceleration.behaviour.1=From 90 m before the waypoint of box 13.
situation.zoneAcceleration.behaviour.2=Only 90 m after it.
situation.zoneAcceleration.behaviour.3=From box 12.
situation.zoneAcceleration.behaviour.4=Never: the whole zone stays at 30 km/h.
situation.zoneAcceleration.why=When the limit rises, the higher limit applies within 90 m of the waypoint entering the \
  second section, so from 90 m before it (FIM, art. 16.4).
situation.closeBox.ask=You pass box 5. What do you do?
situation.closeBox.behaviour.1=I read box 6 at once: it comes 180 m on.
situation.closeBox.behaviour.2=I read box 6 once my trip shows a whole kilometre more.
situation.closeBox.behaviour.3=I reset my trip to zero.
situation.closeBox.behaviour.4=I ignore box 6: boxes are always 400 m apart.
situation.closeBox.why=A box 180 m after the one before comes quickly: read it as soon as the one before is passed. \
  The regulations of the FIM say nothing of it; on paper, Box One marks it as the FIA does, by a vertical arrow and \
  the box in green.
situation.keepLeft.ask=Box 9 is a fork. What do you do?
situation.keepLeft.behaviour.1=I keep left at the fork, as the tulip and kpL show.
situation.keepLeft.behaviour.2=I take the right branch.
situation.keepLeft.behaviour.3=I drive between the two tracks.
situation.keepLeft.behaviour.4=I stop to choose.
situation.keepLeft.why=kpL means keep left (FIM, symbols of the road book); the tulip draws the route followed in \
  blue, here the left branch of the fork.
situation.offTrack.ask=Box 20 says HP, CAP 245. What do you do?
situation.offTrack.behaviour.1=I leave the track and hold the heading 245 up to the next box.
situation.offTrack.behaviour.2=I stay on the track until it turns towards 245.
situation.offTrack.behaviour.3=I follow the most marked trace.
situation.offTrack.behaviour.4=I head for the waypoint shown by the NAV-GPS.
situation.offTrack.why=HP means off track, driving by sight (FIM, symbols of the road book): without a trace to \
  follow, the heading (CAP, in degrees from the north) gives the direction to hold on leaving the box.
situation.followRoad.ask=At box 2, you turn left. What do you do up to box 3?
situation.followRoad.behaviour.1=I follow the road without turning off, for 3.5 km up to box 3.
situation.followRoad.behaviour.2=I take the first road on the right.
situation.followRoad.behaviour.3=I leave the road for the first track.
situation.followRoad.behaviour.4=I turn back after a kilometre if nothing comes.
situation.followRoad.why=FRO means follow road (FIM, symbols of the road book): stay on the road, without taking the \
  roads that meet it, up to the next box.

