reading.title=Lecture de cases
reading.intro=Jusqu’à vingt carrefours d’itinéraires tirés au hasard dans la zone visible de la carte : lire la \
  tulipe et choisir la direction à prendre, ou lire la case et cliquer sur la carte la route à prendre. Placer la \
  carte sur les routes où s’entraîner avant de commencer.
