quiz.intro=Jusqu’à vingt questions sur le catalogue de la FIA, chaque élément demandé une fois : un élément du \
  roadbook et sa signification à trouver parmi quatre, ou l’inverse. Répondre avec les boutons ou les touches 1 à 4, \
  puis Entrée pour la question suivante.
