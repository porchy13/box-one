notice.title=Conditions d’utilisation
notice.data=Les parcours sont générés automatiquement à partir des données d’OpenStreetMap, incomplètes ou \
    inexactes par endroits : ils peuvent emprunter des voies interdites, fermées ou dangereuses, et leurs durées \
    sont estimées sans trafic.
notice.rules=Respectez toujours la signalisation, les règles de la circulation et les lois locales : elles seules \
    font foi.
notice.responsibility=Vous êtes seul responsable de l’usage que vous faites des parcours et des roadbooks, y \
    compris lorsque vous les partagez avec d’autres personnes. L’équipe de développement de Box One ne peut en aucun \
    cas être tenue responsable d’une quelconque mauvaise utilisation du logiciel, ni des roadbooks générés, ni des \
    données utilisées.
notice.accept=J’accepte
notice.refuse=Refuser et quitter
export.notice=Parcours indicatif, généré à partir d’OpenStreetMap : seules la signalisation, les règles de la \
    circulation et les lois locales font foi. Ses utilisateurs en sont seuls responsables ; l’équipe de développement \
    de Box One décline toute responsabilité.
