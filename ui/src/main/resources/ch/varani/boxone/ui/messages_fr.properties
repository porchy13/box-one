error.routing.INVALID_MAP=Cette carte ne peut pas être importée : choisissez un extrait OpenStreetMap (.osm.pbf), \
    par exemple de Geofabrik.
error.routing.INVALID_GRAPH=La carte gardée ne peut pas être lue : ouvrez de nouveau son extrait (Fichier › Ouvrir \
    une carte…).
error.routing.POINT_NOT_FOUND=Aucune route près du départ ou de l’arrivée : placez-les sur une route de la carte.
error.routing.NO_ROUTE=Aucune route ne relie le départ à l’arrivée : déplacez l’un des deux.
error.routing.OUTDATED_MAP=Cette carte a été importée par une version précédente et ne connaît pas les routes à \
    péage : importez-la à nouveau (Fichier › Ouvrir une carte…) pour les éviter.
error.detour.NO_DETOUR=Aucun détour dans le budget n’a été trouvé : essayez une autre graine, ou éloignez le \
    départ ou l’arrivée du bord de la carte.
error.detour.INVALID_BUDGET=Le budget va de 0 à 60 minutes, ou de 5 à 100 % de l’itinéraire le plus rapide, \
  par pas de 5.
error.unexpected=Le travail a échoué de façon inattendue : réessayez ; s’il échoue encore, ouvrez de nouveau la carte.
error.settings=Les réglages ne peuvent pas être enregistrés : vérifiez l’espace libre du disque et les droits sur le \
    dossier de l’application.
error.export=Le roadbook ne peut pas être écrit : vérifiez l’espace libre du disque et les droits sur le \
    dossier choisi.
error.read.UNREADABLE=Le roadbook ne peut pas être lu : vérifiez que le fichier existe encore et que vous pouvez \
    le lire.
error.read.TOO_LARGE=Le fichier est trop grand pour être un roadbook de Box One.
error.read.MALFORMED=Le fichier n’est pas un fichier GPX lisible : il est peut-être endommagé.
error.read.NOT_BOX_ONE=Le fichier n’est pas un roadbook exporté par Box One : seuls ceux-ci peuvent être ouverts.
error.read.NEWER_FORMAT=Le roadbook a été exporté par une version plus récente de Box One : mettez à jour \
    l’application pour l’ouvrir.
error.read.INVALID=Le roadbook est incomplet ou endommagé : il ne peut pas être ouvert.
error.validation.INVALID_LATITUDE=La latitude doit être comprise entre −90° et 90°.
error.validation.INVALID_LONGITUDE=La longitude doit être comprise entre −180° et 180°.
error.validation.TOO_FEW_POINTS=Un itinéraire a besoin d’un départ et d’une arrivée.
error.validation.INVALID_DISTANCE=La distance doit être un nombre positif.
error.validation.INVALID_DURATION=La durée ne peut pas être négative.
error.validation.INVALID_MANEUVER=Une manœuvre doit se trouver sur l’itinéraire, entre son départ et son arrivée.
error.validation.INVALID_BOX_NUMBER=Les cases doivent être numérotées depuis 1, dans leur ordre.
error.validation.INVALID_HEADING=Le cap doit être compris entre 0° et 359°.
error.validation.TOO_FEW_BOXES=Un roadbook a besoin d’une case au départ et d’une case à l’arrivée.
