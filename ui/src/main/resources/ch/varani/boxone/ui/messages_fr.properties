situations.title=Situations de roadbook
situations.intro=Des extraits de roadbook écrits pour l’entraînement, deux ou trois cases dessinées comme sur papier \
  : choisissez comment vous comporter à la case encadrée, puis lisez pourquoi, d’après le règlement de la FIM.
situations.themes=Thèmes
situations.theme.DANGERS=Dangers ({0})
situations.theme.WAYPOINTS=Waypoints ({0})
situations.theme.SPEED_ZONES=Zones de vitesse ({0})
situations.theme.DISTANCES=Distances et notes ({0})
situations.noTheme=Cochez au moins un thème.
situations.failed=Les cases ne peuvent pas être dessinées. Recommencez.
situation.dangerThree.ask=La case 15 arrive. Que faites-vous ?
situation.dangerThree.behaviour.1=Je ralentis fortement bien avant la case et passe le fossé au pas, en passant par \
  le WPS.
situation.dangerThree.behaviour.2=Je garde mon allure : le fossé est signalé, il suffit de bien viser.
situation.dangerThree.behaviour.3=Je contourne largement la case pour éviter le fossé.
situation.dangerThree.behaviour.4=Je freine seulement en voyant le fossé.
situation.dangerThree.why=Trois points d’exclamation sont le danger le plus élevé : ils vont toujours avec un WPS, \
  validé à 30 m, et déclenchent l’alarme sonore du système d’alerte (FIM, art. 11.4). Il faut y passer, lentement, \
  après avoir ralenti bien avant.
situation.dangerOne.ask=La case 8 annonce une bosse. Que faites-vous ?
situation.dangerOne.behaviour.1=Je lève le pied et passe la bosse prudemment, puis je repars.
situation.dangerOne.behaviour.2=Je m’arrête avant la bosse.
situation.dangerOne.behaviour.3=J’accélère pour la sauter.
situation.dangerOne.behaviour.4=Je l’ignore : un seul point d’exclamation ne compte pas.
situation.dangerOne.why=Un point d’exclamation est le danger le plus faible (FIM, symboles du road-book) : lever le \
  pied suffit, sans s’arrêter. Aucune marque de danger n’est à ignorer.
situation.dangerTwo.ask=La case 4 annonce un creux. Que faites-vous ?
situation.dangerTwo.behaviour.1=Je ralentis nettement avant le creux, puis je reprends ma vitesse.
situation.dangerTwo.behaviour.2=Je garde ma vitesse : seul un danger de niveau 3 demande de ralentir.
situation.dangerTwo.behaviour.3=Je m’arrête et descends regarder le creux.
situation.dangerTwo.behaviour.4=Je quitte la piste pour passer à côté.
situation.dangerTwo.why=Deux points d’exclamation sont un danger sérieux, signalé aussi par l’alarme sonore du système \
  d’alerte (FIM, art. 11.4) : abordez-le nettement plus lentement. Quitter la piste expose à d’autres dangers, \
  inconnus, et à manquer la suite du roadbook.
situation.dangerAhead.ask=Vous passez la case 21. Que faites-vous ?
situation.dangerAhead.behaviour.1=Je ralentis déjà : la case suivante, 250 m plus loin, est un danger de niveau 3.
situation.dangerAhead.behaviour.2=J’accélère : il reste 250 m avant de ralentir.
situation.dangerAhead.behaviour.3=Je ne lis la case suivante qu’en y arrivant.
situation.dangerAhead.behaviour.4=Je m’arrête à la case 21 pour attendre.
situation.dangerAhead.why=Lisez toujours la case suivante : à 250 m, elle arrive vite, et un danger de niveau 3, \
  signalé par un WPS validé à 30 m, demande d’avoir ralenti avant (FIM, art. 11.4).
situation.dangerSummit.ask=La case 12 annonce un sommet. Que faites-vous ?
situation.dangerSummit.behaviour.1=Je ralentis avant le sommet : je ne vois pas ce qu’il y a derrière.
situation.dangerSummit.behaviour.2=J’accélère pour passer le sommet avec de l’élan.
situation.dangerSummit.behaviour.3=Je me décale à gauche pour mieux voir.
situation.dangerSummit.behaviour.4=Je m’arrête au sommet pour regarder.
situation.dangerSummit.why=Derrière un sommet, la piste peut tourner ou plonger sans prévenir : adaptez votre conduite \
  au terrain (FIM, art. 11.4) en arrivant lentement, sans changer de trajectoire. S’y arrêter est un danger pour ceux \
  qui suivent.
situation.maskedWaypoint.ask=La case 11 porte un WPM. Comment l’atteignez-vous ?
situation.maskedWaypoint.behaviour.1=Je suis le roadbook de près : le NAV-GPS ne montre le WPM qu’à 800 m, et je dois \
  passer à moins de 90 m.
situation.maskedWaypoint.behaviour.2=Je suis la flèche du NAV-GPS dès la case 10.
situation.maskedWaypoint.behaviour.3=Je coupe tout droit vers le waypoint.
situation.maskedWaypoint.behaviour.4=Je ralentis au pas : un WPM est un waypoint de sécurité.
situation.maskedWaypoint.why=Le WPM, waypoint masqué, vérifie que le roadbook est suivi : le NAV-GPS ne s’y dirige \
  qu’une fois dans son rayon d’ouverture, 800 m ; il est validé à 90 m (FIM, art. 11.2c).
situation.controlWaypoint.ask=La case 6 porte un WPC. Comment l’atteignez-vous ?
situation.controlWaypoint.behaviour.1=Je suis le roadbook exactement : le NAV-GPS ne donne que son nom et son ordre de \
  passage, aucune information de navigation.
situation.controlWaypoint.behaviour.2=J’attends que le NAV-GPS l’ouvre à 800 m.
situation.controlWaypoint.behaviour.3=Je suis la flèche du NAV-GPS.
situation.controlWaypoint.behaviour.4=Je m’arrête à la case pour être contrôlé.
situation.controlWaypoint.why=Le WPC, waypoint de contrôle, vérifie que le roadbook a été respecté : le NAV-GPS n’en \
  donne que le nom et l’ordre de passage, aucune information de navigation ; il est validé à 300 m (FIM, art. 11.2e).
situation.visibleWaypoint.ask=La case 2 porte un WPV. Comment l’atteignez-vous ?
situation.visibleWaypoint.behaviour.1=Je peux suivre le NAV-GPS : il affiche toutes les informations vers un WPV.
situation.visibleWaypoint.behaviour.2=Le NAV-GPS n’affiche rien : je suis le roadbook seul.
situation.visibleWaypoint.behaviour.3=J’attends d’être à 800 m pour le voir.
situation.visibleWaypoint.behaviour.4=Je dois passer à moins de 30 m.
situation.visibleWaypoint.why=Le WPV, waypoint visible, a ses coordonnées dans le roadbook : en s’y dirigeant, le \
  NAV-GPS affiche toutes les informations ; il est validé à 200 m (FIM, art. 11.2a).
situation.navigationWaypoint.ask=La case 31 porte un WPN dans les dunes. Que faites-vous ?
situation.navigationWaypoint.behaviour.1=Je suis le parcours du roadbook sans couper : manquer un WPN coûte 60 \
  minutes.
situation.navigationWaypoint.behaviour.2=Je coupe vers lui dès que le NAV-GPS le montre.
situation.navigationWaypoint.behaviour.3=Je l’évite dans les dunes : il est facultatif.
situation.navigationWaypoint.behaviour.4=Je le valide à 30 m, comme un WPS.
situation.navigationWaypoint.why=Le WPN empêche d’éviter un parcours difficile (dunes) ou une difficulté de navigation \
  ; le NAV-GPS ne s’y dirige qu’à 800 m, il est validé à 200 m, et le manquer coûte 60 minutes, quatre fois la \
  pénalité d’un WPM (FIM, art. 11.2g et tableau des waypoints).
situation.eclipseWaypoint.ask=La case 18 porte un WPE. Quand le NAV-GPS le montre-t-il ?
situation.eclipseWaypoint.behaviour.1=Dès que le WPM de la case 17 est validé, quelle que soit la distance.
situation.eclipseWaypoint.behaviour.2=Seulement à 800 m de lui.
situation.eclipseWaypoint.behaviour.3=Jamais : je suis le roadbook seul.
situation.eclipseWaypoint.behaviour.4=À tout moment, même sans valider la case 17.
situation.eclipseWaypoint.why=Le WPE, waypoint éclipse, devient entièrement visible sur le NAV-GPS une fois le \
  waypoint précédent validé, quelle que soit la distance entre eux ; il est validé à 90 m (FIM, art. 11.2b).
situation.missedWaypoint.ask=À la case 7, vous constatez que le WPM de la case 6 n’a pas été validé. Que faites-vous ?
situation.missedWaypoint.behaviour.1=Je continue : je ne reprends jamais l’itinéraire à contresens, et le WPM manqué \
  coûte 15 minutes.
situation.missedWaypoint.behaviour.2=Je fais demi-tour sur l’itinéraire pour le valider.
situation.missedWaypoint.behaviour.3=Je m’arrête et j’appelle l’organisation.
situation.missedWaypoint.behaviour.4=Je coupe à travers champs vers le waypoint suivant.
situation.missedWaypoint.why=Revenir valider un waypoint manqué ne doit jamais se faire en reprenant l’itinéraire à \
  contresens ; sur une piste étroite à voie unique, tout retour à contresens mène à la disqualification (FIM, art. \
  11.1). Un WPM manqué coûte 15 minutes (art. 11.2).
situation.zoneStart.ask=La case 4 commence une zone de vitesse à 50 km/h. Que faites-vous ?
situation.zoneStart.behaviour.1=Je ralentis avant, pour rouler à 50 km/h au plus tard 90 m après le DZ, où la \
  tolérance prend fin.
situation.zoneStart.behaviour.2=Je ralentis seulement quand le NAV-GPS affiche ma vitesse.
situation.zoneStart.behaviour.3=Je peux rouler à 50 km/h de moyenne sur la zone.
situation.zoneStart.behaviour.4=Je ralentis à la FZ.
situation.zoneStart.why=Le NAV-GPS guide vers le DZ dès 1000 m et prévient 90 m avant lui ; les 90 m après lui sont la \
  zone tampon de décélération, puis la limite s’applique (FIM, art. 16.1).
situation.zoneInside.ask=Vous roulez de la case 5 à la case 6, dans la zone commencée à la case 4. Que faites-vous ?
situation.zoneInside.behaviour.1=Je reste sous 50 km/h jusqu’à la FZ : chaque dépassement est enregistré tous les 150 \
  m ou toutes les 10 secondes.
situation.zoneInside.behaviour.2=Je peux dépasser brièvement quand personne n’est là.
situation.zoneInside.behaviour.3=Je respecte la limite seulement près des maisons.
situation.zoneInside.behaviour.4=Je reprends ma vitesse une fois à 90 m du DZ.
situation.zoneInside.why=Entre le DZ et la FZ, la vitesse est limitée quel que soit l’itinéraire (FIM, art. 16.2) ; \
  pendant un dépassement, une impulsion est enregistrée tous les 150 m ou toutes les 10 secondes, et chacune est \
  pénalisée (art. 16).
situation.zoneFinish.ask=La case 10 termine la zone de vitesse. Quand pouvez-vous accélérer ?
situation.zoneFinish.behaviour.1=Une fois à moins de 90 m de la FZ, son rayon de validation : la tolérance commence là.
situation.zoneFinish.behaviour.2=Dès que je vois la case 10 dans le roadbook.
situation.zoneFinish.behaviour.3=Dès que la route est dégagée.
situation.zoneFinish.behaviour.4=Seulement à la case suivante.
situation.zoneFinish.why=Autour de la FZ, dans un rayon de 90 m, une zone de tolérance permet d’accélérer à nouveau \
  (FIM, art. 16.3).
situation.zoneSigns.ask=La case 2 commence une zone à 50 km/h, mais aucun panneau n’est visible sur place. Que \
  faites-vous ?
situation.zoneSigns.behaviour.1=Je respecte les 50 km/h du roadbook, panneau ou pas.
situation.zoneSigns.behaviour.2=Je garde mon allure tant qu’aucun panneau n’apparaît.
situation.zoneSigns.behaviour.3=J’attends le bip du NAV-GPS pour ralentir.
situation.zoneSigns.behaviour.4=Je roule à la vitesse légale du pays.
situation.zoneSigns.why=La limite est celle du roadbook ; l’absence de panneaux ne permet aucune réclamation, et le \
  bip ou l’alarme ne sont pas une information officielle (FIM, art. 16).
situation.zoneAcceleration.ask=À la case 13, la zone à 30 km/h continue à 50 km/h. Quand pouvez-vous rouler à 50 km/h ?
situation.zoneAcceleration.behaviour.1=Dès 90 m avant le waypoint de la case 13.
situation.zoneAcceleration.behaviour.2=Seulement 90 m après lui.
situation.zoneAcceleration.behaviour.3=Dès la case 12.
situation.zoneAcceleration.behaviour.4=Jamais : toute la zone reste à 30 km/h.
situation.zoneAcceleration.why=Quand la limite augmente, la limite la plus élevée s’applique dans un rayon de 90 m \
  autour du waypoint d’entrée de la seconde section, donc dès 90 m avant lui (FIM, art. 16.4).
situation.closeBox.ask=Vous passez la case 5. Que faites-vous ?
situation.closeBox.behaviour.1=Je lis tout de suite la case 6 : elle arrive 180 m plus loin.
situation.closeBox.behaviour.2=Je lis la case 6 quand mon trip affiche un kilomètre de plus.
situation.closeBox.behaviour.3=Je remets mon trip à zéro.
situation.closeBox.behaviour.4=J’ignore la case 6 : les cases sont toujours à 400 m l’une de l’autre.
situation.closeBox.why=Une case à 180 m de la précédente arrive vite : lisez-la dès la précédente passée. Le règlement \
  FIM n’en dit rien ; sur le papier, Box One la signale comme la FIA, par une flèche verticale et la case en vert.
situation.keepLeft.ask=La case 9 est une fourche. Que faites-vous ?
situation.keepLeft.behaviour.1=Je serre à gauche à la fourche, comme le montrent la tulipe et kpL.
situation.keepLeft.behaviour.2=Je prends la branche de droite.
situation.keepLeft.behaviour.3=Je roule entre les deux pistes.
situation.keepLeft.behaviour.4=Je m’arrête pour choisir.
situation.keepLeft.why=kpL signifie serrer à gauche (FIM, symboles du road-book) ; la tulipe dessine l’itinéraire \
  suivi en bleu, ici la branche de gauche de la fourche.
situation.offTrack.ask=La case 20 indique HP, CAP 245. Que faites-vous ?
situation.offTrack.behaviour.1=Je quitte la piste et tiens le cap 245 jusqu’à la case suivante.
situation.offTrack.behaviour.2=Je reste sur la piste jusqu’à ce qu’elle tourne vers 245.
situation.offTrack.behaviour.3=Je suis la trace la plus marquée.
situation.offTrack.behaviour.4=Je me dirige vers le waypoint montré par le NAV-GPS.
situation.offTrack.why=HP signifie hors piste, conduite à vue (FIM, symboles du road-book) : sans trace à suivre, le \
  cap (CAP, en degrés depuis le nord) donne la direction à tenir en quittant la case.
situation.followRoad.ask=À la case 2, vous tournez à gauche. Que faites-vous jusqu’à la case 3 ?
situation.followRoad.behaviour.1=Je suis la route sans la quitter, 3,5 km jusqu’à la case 3.
situation.followRoad.behaviour.2=Je prends la première route à droite.
situation.followRoad.behaviour.3=Je quitte la route pour la première piste.
situation.followRoad.behaviour.4=Je fais demi-tour après un kilomètre si rien ne vient.
situation.followRoad.why=FRO signifie suivre la route (FIM, symboles du road-book) : restez sur la route, sans prendre \
  les routes qui la rejoignent, jusqu’à la case suivante.

